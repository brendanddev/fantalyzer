services:

  ### Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantalyzer
      POSTGRES_PASSWORD: fantalyzer
      POSTGRES_DB: fantalyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantalyzer"]
      interval: 2s
      timeout: 5s
      retries: 10

  ### Sleeper data ingestion service
  ingest-sleeper:
    build:
      context: .
      dockerfile: services/ingest-sleeper/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  ### Handcuff / backfield map service
  handcuff-service:
    build:
      context: .
      dockerfile: services/handcuff-service/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/handcuff-service/data:/app/data

  ### Scoring engine
  scoring-engine:
    build:
      context: .
      dockerfile: services/scoring-engine/Dockerfile
    env_file:
      - .env
    environment:
      HANDCUFF_SERVICE_URL: http://handcuff-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      handcuff-service:
        condition: service_started
  
  ### Alert dispatcher
  alert-dispatcher:
    build:
      context: .
      dockerfile: services/alert-dispatcher/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
