[project]
name = "ingest-news"
version = "0.1.1"
description = "Polls ESPN's NFL RSS feed and matches stories to known players."
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.32",
    "psycopg2-binary>=2.9",
    "schedule>=1.2",
    "pydantic>=2.7",
]

[tool.setuptools]
py-modules = ["main"]
